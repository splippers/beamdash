<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beamdash</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-3">
  <a class="navbar-brand fw-bold" href="#" onclick="return App.nav('')">
    <i class="bi bi-lightning-fill text-warning"></i> beamdash
  </a>
  <div class="d-flex align-items-center gap-2">
    <span class="text-secondary small" id="nav-status"></span>
    <button class="btn btn-outline-secondary btn-sm" onclick="App.showSettings()" title="Settings"><i class="bi bi-gear"></i></button>
  </div>
</nav>

<!-- Settings Modal -->
<div class="modal fade" id="settings-modal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title"><i class="bi bi-gear me-1"></i>Settings</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label small text-secondary">API Key</label>
          <input class="form-control form-control-sm" id="api-key-input" type="password" placeholder="Enter API key">
        </div>
        <div class="mb-2">
          <label class="form-label small text-secondary">API Host</label>
          <input class="form-control form-control-sm" id="api-host-input" placeholder="http://localhost:8999">
        </div>
      </div>
      <div class="modal-footer">
        <span id="api-key-status" class="small me-auto"></span>
        <button class="btn btn-warning btn-sm" onclick="App.saveSettings()"><i class="bi bi-check"></i> Save</button>
      </div>
    </div>
  </div>
</div>
<main id="main" class="container-fluid py-4"></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
